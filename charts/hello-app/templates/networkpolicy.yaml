{{- if .Values.networkPolicy.enabled -}}
# scripts/bootstrap.sh  starts minikube with --cni=calico, and scripts/verify.sh proves enforcement rather than assuming it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hello-app.fullname" . }}
  labels:
    {{- include "hello-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hello-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Serving traffic on the app port. Any source, because this is the only way
    # in and the Service is cluster-internal anyway.
    - ports:
        - port: http
          protocol: TCP
  egress:
    # Cluster DNS. Both UDP and TCP 53 - TCP is used for responses too large for
    # UDP, and omitting it produces intermittent resolution failures that are
    # painful to diagnose.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
